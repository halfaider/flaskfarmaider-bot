discord:
  # 봇 토큰
  token: 'zzzzzzzzzzzzzzzzzzzzzzzzzz.zzzzzz.zzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzz'
  command:
    prefix: '!'
    broadcast:
      channels:
        # 방송 명령어(gds, downloader 등)가 허용되는 채널 (생략시 모든 채널)
        - 1344xxxxxxxxxxx0822 # SJVA 서버의 구드공-방송 채널 ID
    admin:
      channels:
        # 관리 명령어(roles 등)가 허용되는 채널 (생략시 모든 채널)
        - 1234567890123456789
  auto_roles:
    # 앱(봇)이 서버에 참가했을 때 자동으로 부여할 역할 ID
    1234567890123456789: # 서버 ID
      roles:
        - 1234567890123456789 # role ID
      pattern: '^ffbot_.+$' # 앱(봇) 이름 정규표현식 (생략시 모든 봇에 부여)
      channel: 1234567890123456789 # 결과 메시지를 출력할 채널 ID
broadcast:
  # FlaskFarmBot 서버의 bot_gds_user(1250xxxxxxxxxxx2416) 채널에 본인의 봇으로 직접 방송이 가능함
  # 디스코드에서 본인의 봇을 생성후 FlaskFarmBot 서버에 메시지 전송 권한을 부여해서 설치
  #
  # 두 가지 방송 방식
  # 1. source 채널에 수신된 메시지를 target 채널에 송신
  #   - 봇이 특정 채널에서 받은 방송 메시지를 다시 FlaskFarmBot 서버의 bot_gds_user(1250xxxxxxxxxxx2416) 채널에 전송
  #   - 봇을 본인의 디스코드 서버에 설치 후 source.channels를 본인의 서버 채널로 설정
  #   - gds_tool의 "방송 하기" 웹후크를 아래 source.channels의 웹후크로 수정
  #   - gds_tool의 "방송 하기"로 source.channels에 방송 (웹 혹은 API)
  #   - flaskfarmaider 봇이 source.channels에서 수신된 방송을 다시 FlaskFarmBot 서버의 bot_gds_user(1250xxxxxxxxxxx2416) 채널로 송신
  # 2. 봇 API로 입력받은 내용을 직접 FlaskFarmBot 서버의 bot_gds_user(1250xxxxxxxxxxx2416) 채널에 전송
  #   - curl -v "http://localhost:8080/api/broadcast?apikey=bot-api-key" -d 'path=/ROOT/GDRIVE/THIS/IS/A/TEST' -d 'mode=REFRESH'
  source:
    # 채널 ID와 저자(웹훅) ID가 일치하고 메시지가 방송용 콘텐츠(```암호화된 문자열```)일 경우 방송
    # 봇 API로 방송할 경 경우 설정할 필요 없음
    #channels:
    #  - xxxxxxxxxxxxxxxxxxx # 봇이 듣고 있을 채널 ID
    #authors:
    #  - yyyyyyyyyyyyyyyyyyy # 봇이 듣고 있을 채널의 웹훅 ID
  target:
    # 방송을 보낼 채널 ID
    channels:
      - 1250xxxxxxxxxxx2416 # FlaskFarmBot 서버의 bot_gds_user 채널 ID
  relay:
    # 지정된 채널에서 수신한 메시지를 to 채널로 재전송
    1234567890123456789:
      - to: 1234567890123456789
    1234567890123456789:
      - to: 1234567890123456789
        # 재전송할 메시지 정규표현식 (생략시 모든 메시지)
        pattern: '^\^[A-Za-z0-9+/=]+$'
  encrypt:
    # Flaskfarm의 support.base.aes 에서 사용하는 key
    key: 140bxxxxxxxxxxxxxxxxxxxxxxxx7e14
  module_rules:
    # 각 파일당 적용될 플러그인의 모듈 설정
    # 파일의 전체 경로가 patterns의 정규표현식과 매치되거나 roots 경로의 하위경로이면
    # metadata, bot_downloader 플러그인에서 각각 설정한 모듈을 사용
    # 가장 먼저 통과하는 규칙의 설정을 따름
    - metadata: ktv
      bot_downloader: vod
      patterns: ['-SW\.', '-ST\.']
    - metadata: movie
      bot_downloader: share_movie
      roots:
        - '/ROOT/GDRIVE/...'
    - metadata: ftv
      bot_downloader: vod
      roots:
        - '/ROOT/GDRIVE/...'
    - metadata: ktv
      bot_downloader: vod
      patterns: ['.*']
  genre_by_subfolders:
    # 이 경로의 파일들은 지정된 경로의 첫번째 하위 폴더명을 장르로 사용
    - "/ROOT/GDRIVE/.../영화"
  ott_metadata_roots:
    # 이 경로의 파일들은 ott 메타데이터를 우선 사용
    - '/ROOT/GDRIVE/...'
  title_patterns:
    # 기본 파일명으로 검색되지 않을 경우를 대비한 타이틀 정규표현식
    - '^[\[\(].+[\]\)]\s(?P<title>.*?)(?:\s*[\(\[].*[\]\)])?$'
    - '^.+?[-~](?P<title>.+?)[-~]'
    - '^[^\w\s\(\[](?P<title>.+?)[^\w\s\)\]]'
    - '^(?P<title>.+?)(?:\s*\(\d{4}\))?$'
api:
  # api 설정
  # POST, http://0.0.0.0:8080/api/broadcast
  #keys:
    # api key는 여러개 설정 가능하며 입력하지 않을 경우 api key를 사용하지 않음
    # api key는 헤더, 쿼리, 바디 중 어디에 넣어도 상관 없음
    # 헤더: 'X-apikey: bot-api-key'
    # 쿼리: '?apikey=bot-api-key'
    # 바디: 'apikey=bot-api-key'
  #  - 'bot-api-key'
  # 사용할 포트
  #port: 8080
  # 특정 호스트명으로만 접속 가능하게 할 경우 지정, 그 외 0.0.0.0
  #host: '0.0.0.0'
flaskfarm:
  # flaskfarm 서버
  url: 'http://flaskfarm:9999'
  apikey: 1234567890
tmdb:
  # 경로상의 tmdb ID 정규표현식
  id_patterns:
    - '{tmdb-(?P<id>\d+)}'
images:
  # 포스터가 없을 경우 사용할 이미지
  no_poster: "https://dummyimage.com/200x300/000/fff.jpg&text=No+Image"